<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Autênticas Store</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <img src="../assets/logo.png" alt="Autênticas Store">
      <span>Autênticas Store</span>
    </div>
    <nav class="admin-nav">
      <button type="button" class="is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
        <span>Vendas</span>
      </button>
    </nav>
    <button type="button" class="logout" id="logoutBtn">Sair</button>
  </aside>

  <main class="admin-main">
    <section class="admin-view is-active" id="view-pedidos">
      <div class="admin-header">
        <h1>Vendas</h1>
        <button type="button" class="btn-ghost" id="refreshBtn">Atualizar</button>
      </div>
      <p style="font-size:12.5px;color:var(--cinza);margin:-14px 0 20px">
        Dados vêm direto da sua conta do Mercado Pago. Para editar produtos, preços e fotos, altere o arquivo do catálogo do site (fale com a Sety Studio).
      </p>
      <div class="stat-row" id="orderStats"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Status</th><th>Pagamento</th></tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
