<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; background: #000; }
  .stage { width: 1024px; height: 1024px; position: relative; }
  svg { display: block; }
  .imperial-texto {
    font-family: 'Playfair Display', serif; font-weight: 800;
  }
  .store-texto {
    font-family: 'Montserrat', sans-serif; font-weight: 700;
  }
</style>
</head>
<body>
<div class="stage">
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="anelOuro" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FCE9AE"/>
      <stop offset="22%" stop-color="#F3CE73"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#B8860B"/>
      <stop offset="82%" stop-color="#8a6a14"/>
      <stop offset="100%" stop-color="#c9962f"/>
    </linearGradient>
    <linearGradient id="textoOuro" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FCE9AE"/>
      <stop offset="35%" stop-color="#E8C158"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>

  <circle cx="512" cy="512" r="440" fill="none" stroke="url(#anelOuro)" stroke-width="24"/>

  <text x="512" y="500" text-anchor="middle" class="imperial-texto" font-size="108" letter-spacing="6" fill="url(#textoOuro)">IMPERIAL</text>

  <line x1="288" y1="578" x2="410" y2="578" stroke="#D9AF44" stroke-width="4"/>
  <text x="512" y="592" text-anchor="middle" class="store-texto" font-size="38" letter-spacing="10" fill="url(#textoOuro)">STORE</text>
  <line x1="614" y1="578" x2="736" y2="578" stroke="#D9AF44" stroke-width="4"/>
</svg>
</div>
</body>
</html>
